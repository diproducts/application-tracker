name: Continuous Integration Staging

on:
  push:
    branches:
      - backend_development

concurrency:
  group: dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/github
          chmod 600 ~/.ssh/github
          cat >>~/.ssh/config <<END
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/github
            LogLevel ERROR
            StrictHostKeyChecking no
          END
      - name: Create .env files
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          REACT_APP_ENV_FILE: ${{ secrets.REACT_APP_ENV_FILE }}
        run: |
          ssh target "cd code/application-tracker/ && echo '$ENV_FILE' > .env && echo '$REACT_APP_ENV_FILE' > frontend/.env"
      - name: Run backend
        run: |
          ssh target "cd code/application-tracker/ && git pull && make run-production"
      - name: Build frontend
        run: |
          ssh target "cd code/application-tracker/ && make build-frontend && rm -r /var/www/application-tracker/ && cp -r frontend/build /var/www/application-tracker"
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Staging: New Application Tracker version up"
          to: ${{ secrets.EMAIL_NOTIFICATION_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: Hey! A new STAGING version of Application Tracker has been uploaded to ${{ secrets.DOMAIN }}
